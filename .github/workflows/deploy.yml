name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; corridas em fila não se atropelam.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # O roteamento é client-side: um deep link (/winners/x) chega ao Pages
      # como arquivo inexistente. O 404 devolve o mesmo index e o router resolve.
      - run: cp dist/index.html dist/404.html
      # /overlay/live é a fonte de navegador do OBS, colada à mão numa cena que
      # recarrega sozinha. O fallback de 404 renderiza, mas devolvendo status
      # 404; um arquivo de verdade faz essa rota responder 200.
      - run: mkdir -p dist/overlay/live && cp dist/index.html dist/overlay/live/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
